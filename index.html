        .orbit-item img {

            display: block;
            pointer-events: none;

const items = document.querySelectorAll('.orbit-item');
const dots = document.querySelectorAll('.dot');
const total = items.length;
let activeIndex = 0;
// Elemen Panel Deskripsi
const descPanel = document.getElementById('descPanel');
const descTitle = document.getElementById('descTitle');
const descLocation = document.getElementById('descLocation');
const descText = document.getElementById('descText');
const descHighlights = document.getElementById('descHighlights');
function updateDescription(index) {
const data = wisataData[index];
descPanel.style.opacity = '0.4';
setTimeout(() => {
descTitle.textContent = data.title;
descLocation.textContent = data.location;
descText.textContent = data.text;
descHighlights.innerHTML = data.highlights
.map(item => <span class="highlight-tag">${item}</span>)
.join('');
descPanel.style.opacity = '1';
}, 150);
}
function updatePositions() {
items.forEach((item, index) => {
const relativePos = (index - activeIndex + total) % total;
item.className = orbit-item pos-${relativePos};
});
dots.forEach((dot, index) => {
dot.classList.toggle('active', index === activeIndex);
});
// Perbarui deskripsi otomatis sesuai gambar yang sedang berada di tengah
updateDescription(activeIndex);
}
function rotateTo(targetIndex) {
activeIndex = targetIndex;
updatePositions();
}
function nextSlide() {
activeIndex = (activeIndex + 1) % total;
updatePositions();
}
function prevSlide() {
activeIndex = (activeIndex - 1 + total) % total;
updatePositions();
}
// Fitur Geser (Swipe / Drag) untuk HP & Mouse
const stage = document.getElementById('orbitStage');
let startX = 0;
stage.addEventListener('touchstart', (e) => {
startX = e.touches.clientX;
}, { passive: true });
stage.addEventListener('touchend', (e) => {
const endX = e.changedTouches.clientX;
if (startX - endX > 40) nextSlide();
if (endX - startX > 40) prevSlide();
});
stage.addEventListener('mousedown', (e) => {
startX = e.clientX;
});
stage.addEventListener('mouseup', (e) => {
const endX = e.clientX;
if (startX - endX > 40) nextSlide();
if (endX - startX > 40) prevSlide();
});
